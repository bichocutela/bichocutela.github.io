name: Adicionar Ver Cod Barra PWA uma vez
on:
  push:
    branches: [main]
    paths: ['.github/workflows/add-barcode-view-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 10.4.1 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - name: Instalar dependencias
        working-directory: source
        run: |
          pnpm install --frozen-lockfile
          pnpm add jsbarcode @types/jsbarcode
      - name: Aplicar botao e balao
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('source/client/src/pages/ProductConsultation.tsx')
          s=p.read_text()
          s=s.replace('  RefreshCw,\n  Search,', '  RefreshCw,\n  Barcode,\n  Search,')
          old='''function ProductDetail({ product, offers, queriedAt, busy, canAdd, onRefresh, onAdd, onClose }: {\n  product: ConsultationProduct;\n  offers: CommercialOffer[];\n  queriedAt: string | null;\n  busy: boolean;\n  canAdd: boolean;\n  onRefresh: () => void;\n  onAdd: () => void;\n  onClose: () => void;\n}) {\n  return <div className="pc-modal-backdrop"'''
          new='''function ProductDetail({ product, offers, queriedAt, busy, canAdd, onRefresh, onAdd, onClose }: {\n  product: ConsultationProduct;\n  offers: CommercialOffer[];\n  queriedAt: string | null;\n  busy: boolean;\n  canAdd: boolean;\n  onRefresh: () => void;\n  onAdd: () => void;\n  onClose: () => void;\n}) {\n  const [barcodeOpen, setBarcodeOpen] = useState(false);\n  return <>\n  <div className="pc-modal-backdrop"'''
          if old not in s: raise SystemExit('inicio ProductDetail nao encontrado')
          s=s.replace(old,new,1)
          oldbtn='''<button onClick={onRefresh} disabled={busy}><RefreshCw className={busy ? "is-spinning" : ""} size={17} /> Atualizar preços</button>\n      {canAdd && <button onClick={onAdd}><PackagePlus size={17} /> Adicionar ao NRD</button>}'''
          newbtn='''<button onClick={onRefresh} disabled={busy}><RefreshCw className={busy ? "is-spinning" : ""} size={17} /> Atualizar preços</button>\n      <button className="pc-barcode-action" onClick={() => setBarcodeOpen(true)} disabled={!product.barcode && !product.code}><Barcode size={17} /> Ver Cód Barra</button>\n      {canAdd && <button onClick={onAdd}><PackagePlus size={17} /> Adicionar ao NRD</button>}'''
          if oldbtn not in s: raise SystemExit('botoes detalhe nao encontrados')
          s=s.replace(oldbtn,newbtn,1)
          oldend='''    <details className="pc-sync"><summary>Sincronização</summary><p>Última consulta desta ficha: {formatConsultedAt(queriedAt)}.</p></details>\n  </section></div>;\n}\n'''
          newend='''    <details className="pc-sync"><summary>Sincronização</summary><p>Última consulta desta ficha: {formatConsultedAt(queriedAt)}.</p></details>\n  </section></div>\n  {barcodeOpen && <ProductBarcodeDialog product={product} onClose={() => setBarcodeOpen(false)} />}\n  </>;\n}\n\nfunction ProductBarcodeDialog({ product, onClose }: { product: ConsultationProduct; onClose: () => void }) {\n  const svgRef = useRef<SVGSVGElement>(null);\n  const barcodeValue = product.barcode || product.code;\n  const [profile, setProfile] = useState<"Padrão" | "Symbol" | "Datalogic">("Padrão");\n  const [zoom, setZoom] = useState(100);\n  useEffect(() => {\n    let active = true;\n    void import("jsbarcode").then(({ default: JsBarcode }) => {\n      if (!active || !svgRef.current || !barcodeValue) return;\n      JsBarcode(svgRef.current, barcodeValue, {\n        format: "CODE128",\n        displayValue: false,\n        margin: 0,\n        width: profile === "Datalogic" ? 2.4 : profile === "Symbol" ? 2.2 : 2,\n        height: profile === "Datalogic" ? 120 : profile === "Symbol" ? 110 : 95,\n      });\n    }).catch(() => undefined);\n    return () => { active = false; };\n  }, [barcodeValue, profile]);\n\n  return <div className="pc-modal-backdrop pc-barcode-backdrop" onMouseDown={onClose}>\n    <section className="pc-barcode-dialog" role="dialog" aria-modal="true" aria-label="Código de barras" onMouseDown={(event) => event.stopPropagation()}>\n      <button className="pc-detail-close" onClick={onClose} aria-label="Fechar"><X /></button>\n      <h2>{product.description}</h2>\n      <strong className="pc-barcode-number">{barcodeValue}</strong>\n      <span className="pc-barcode-category">{product.categories[0] || "Consulta de preços"}</span>\n      <div className="pc-barcode-image" style={{ transform: `scale(${zoom / 100})` }}><svg ref={svgRef} /></div>\n      <span className="pc-barcode-caption">Código de barras / Referência</span>\n      <div className="pc-barcode-profile-title"><Barcode size={20} /><strong>Perfil do Leitor</strong></div>\n      <div className="pc-barcode-profiles">{(["Padrão", "Symbol", "Datalogic"] as const).map((item) => <button className={profile === item ? "active" : ""} key={item} onClick={() => setProfile(item)}>{item}</button>)}</div>\n      <div className="pc-barcode-zoom"><span>Ajuste de leitura</span><div><button onClick={() => setZoom((value) => Math.max(80, value - 10))}>−</button><strong>{zoom}%</strong><button onClick={() => setZoom((value) => Math.min(120, value + 10))}>+</button></div></div>\n      <button className="pc-barcode-close" onClick={onClose}>FECHAR</button>\n    </section>\n  </div>;\n}\n'''
          if oldend not in s: raise SystemExit('fim ProductDetail nao encontrado')
          s=s.replace(oldend,newend,1)
          p.write_text(s)

          css=Path('source/client/src/pages/ProductConsultation.css')
          c=css.read_text()
          extra='''\n.pc-detail-actions .pc-barcode-action{background:#fff;color:#8c6d08;border:1px solid #d8c57d}.pc-barcode-backdrop{z-index:130}.pc-barcode-dialog{position:relative;width:min(92vw,560px);max-height:92vh;overflow:auto;border-radius:30px;background:#fff;padding:26px 24px;box-shadow:0 28px 90px rgba(0,0,0,.34);display:flex;flex-direction:column;align-items:center}.pc-barcode-dialog h2{margin:4px 46px 10px;text-align:center;font-size:1.55rem;line-height:1.14}.pc-barcode-number{font-size:2.45rem;line-height:1;color:#8c6d08;word-break:break-all;text-align:center}.pc-barcode-category{margin-top:8px;color:#666;font-weight:800;text-transform:uppercase}.pc-barcode-image{margin:24px auto 12px;transform-origin:center;max-width:100%;overflow:hidden;background:#fff}.pc-barcode-image svg{display:block;max-width:100%;height:auto}.pc-barcode-caption{color:#666;font-size:.9rem}.pc-barcode-profile-title{width:100%;display:flex;align-items:center;gap:8px;margin-top:24px;padding-top:18px;border-top:1px solid #ddd;color:#8c6d08}.pc-barcode-profiles{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.pc-barcode-profiles button{min-height:40px;border:1px solid #cfcfcf;border-radius:11px;background:#fff;font-weight:800}.pc-barcode-profiles button.active{background:#b49116;color:#fff;border-color:#b49116}.pc-barcode-zoom{width:100%;display:grid;place-items:center;gap:10px;margin-top:18px}.pc-barcode-zoom>span{font-weight:800}.pc-barcode-zoom>div{display:flex;align-items:center;gap:18px}.pc-barcode-zoom button{width:40px;height:40px;border:1px solid #ddd;border-radius:50%;background:#fff;font-size:1.4rem}.pc-barcode-close{width:100%;margin-top:22px;border:0;border-radius:18px;padding:13px;background:#b49116;color:#fff;font-weight:900}.pc-barcode-dialog .pc-detail-close{top:14px;right:14px}\n'''
          if '.pc-barcode-dialog{' not in c: css.write_text(c+extra)
          PY
      - name: Remover workflow temporario
        run: rm .github/workflows/add-barcode-view-once.yml
      - name: Validar
        working-directory: source
        run: |
          pnpm check
          pnpm exec vite build
      - name: Commit e push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/package.json source/pnpm-lock.yaml source/client/src/pages/ProductConsultation.tsx source/client/src/pages/ProductConsultation.css .github/workflows/add-barcode-view-once.yml
          git commit -m 'Adiciona Ver Cód Barra na consulta PWA'
          git push