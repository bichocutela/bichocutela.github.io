name: Adicionar Ver Cod Barra no PWA uma vez

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-barcode-view-pwa-once.yml
      - .github/scripts/add_barcode_view_pwa.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - name: Instalar dependencias
        working-directory: source
        run: pnpm install --frozen-lockfile
      - name: Adicionar JsBarcode
        working-directory: source
        run: |
          pnpm add jsbarcode@3.11.6
          pnpm add -D @types/jsbarcode@3.11.4
      - name: Aplicar alteracao
        run: python3 .github/scripts/add_barcode_view_pwa.py
      - name: Validar TypeScript e build
        working-directory: source
        run: |
          pnpm check
          pnpm exec vite build
      - name: Remover temporarios
        run: rm .github/workflows/add-barcode-view-pwa-once.yml .github/scripts/add_barcode_view_pwa.py
      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/package.json source/pnpm-lock.yaml source/client/src/pages/ProductConsultation.tsx source/client/src/pages/ProductConsultation.css .github/workflows/add-barcode-view-pwa-once.yml .github/scripts/add_barcode_view_pwa.py
          git commit -m "Adiciona Ver Cod Barra na consulta do PWA"
          git push
