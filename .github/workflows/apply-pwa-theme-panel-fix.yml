name: Aplicar correção PWA temas e painel
# execução definitiva: sem ponte Glass para Multicolor

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-pwa-theme-panel-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar correção
        run: python3 .github/scripts/patch_pwa_theme_panel.py

      - name: Commitar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/client/src/lib/nrd.ts
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
          else
            git commit -m "fix(pwa): separar fundo Glass Soft do Multicolor"
            git push
          fi
