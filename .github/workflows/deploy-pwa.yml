name: Publicar PWA
# publicação acionada após ajuste de contraste do painel administrativo

on:
  push:
    branches: [main]
    paths:
      - "source/**"
      - ".github/workflows/deploy-pwa.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-pwa
  cancel-in-progress: true

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Verificar TypeScript
        run: pnpm check

      - name: Gerar PWA
        run: pnpm exec vite build

      - name: Publicar arquivos gerados
        working-directory: .
        run: |
          cp source/dist/public/index.html index.html
          cp -R source/dist/public/assets/. assets/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/
          if git diff --cached --quiet; then
            echo "Nenhuma alteração gerada."
          else
            git commit -m "Publica nova versão do PWA [skip ci]"
            git push
          fi
