name: Patch layout desktop

on:
  push:
    branches: [desktop-layout-fix]
    paths:
      - ".github/workflows/desktop-layout-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: desktop-layout-fix
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Aplicar ajustes desktop
        run: |
          python - <<'PY'
          from pathlib import Path

          desktop = Path('source/client/src/desktop.css')
          s = desktop.read_text()
          marker = '/* Desktop drawer: rolagem independente e segura. */'
          if marker not in s:
              s += r'''

/* Desktop drawer: rolagem independente e segura. */
@media (min-width: 1024px) {
  .nrd-overlay { overflow: hidden; }
  .nrd-drawer {
    box-sizing: border-box;
    height: 100dvh;
    min-height: 0;
    max-height: 100dvh;
    overflow-y: auto;
    overscroll-behavior: contain;
    scrollbar-gutter: stable;
    padding-bottom: 2rem;
  }
  .nrd-drawer > header {
    position: sticky;
    top: -1rem;
    z-index: 3;
    margin: -1rem -1rem 0;
    padding: 1rem 1rem .65rem;
    background: #fffdf7;
  }
}
'''
              desktop.write_text(s)

          pc = Path('source/client/src/pages/ProductConsultation.css')
          s = pc.read_text()
          marker = '/* Desktop: consulta ampla, banner compacto e 20 resultados aproveitando a tela. */'
          if marker not in s:
              s += r'''

/* Desktop: consulta ampla, banner compacto e 20 resultados aproveitando a tela. */
@media (min-width: 1024px) {
  .pc-page { min-height: 100vh; padding-bottom: 64px; }
  .pc-header {
    position: relative;
    top: auto;
    z-index: 10;
    grid-template-columns: 48px minmax(0, 600px) 48px;
    justify-content: center;
    gap: 14px;
    padding: 12px 24px;
    background: #f6f5f3;
    backdrop-filter: none;
  }
  .pc-header .pc-icon-button { align-self: center; }
  .pc-banner {
    width: 100%;
    min-height: 0 !important;
    aspect-ratio: 3 / 1 !important;
    border-radius: 18px;
    background: #fff !important;
  }
  .pc-banner img {
    object-fit: contain !important;
    transform: none !important;
    transform-origin: center !important;
  }
  .pc-search-shell {
    width: min(1280px, calc(100% - 48px));
    max-width: none;
    margin-top: 16px;
    padding: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 220px;
    gap: 8px 12px;
    align-items: start;
  }
  .pc-search-row { grid-column: 1; }
  .pc-search-actions,
  .pc-search-actions--single {
    grid-column: 2;
    grid-template-columns: 1fr;
    margin-top: 0;
  }
  .pc-search-actions button {
    min-height: 54px;
    justify-content: center;
    border-radius: 20px;
  }
  .pc-search-status,
  .pc-error,
  .pc-config-warning,
  .pc-diagnostic { grid-column: 1 / -1; }
  .pc-results {
    width: min(1320px, calc(100% - 48px));
    max-width: none;
    margin: 16px auto 0;
    padding: 0;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    align-items: stretch;
  }
  .pc-product-card { min-height: 92px; padding: 12px 14px; }
  .pc-empty { grid-column: 1 / -1; }
  .pc-pagination {
    width: min(1320px, calc(100% - 48px));
    max-width: none;
    margin: 18px auto 0;
    padding: 0;
  }
  .pc-pagination span::after { content: " · 20 produtos por página"; }
}

@media (min-width: 1440px) {
  .pc-header { grid-template-columns: 48px minmax(0, 660px) 48px; }
  .pc-search-shell,
  .pc-results,
  .pc-pagination { width: min(1400px, calc(100% - 72px)); }
}
'''
              pc.write_text(s)
          PY

      - name: Validar diff
        run: git diff --check

      - name: Instalar dependências
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Verificar TypeScript
        working-directory: source
        run: pnpm check

      - name: Gerar build
        working-directory: source
        run: pnpm exec vite build

      - name: Remover workflow temporário e commitar
        run: |
          rm -f .github/workflows/desktop-layout-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/client/src/desktop.css source/client/src/pages/ProductConsultation.css .github/workflows/desktop-layout-fix.yml
          git commit -m 'Organiza PWA para uso no desktop'
          git push origin HEAD:desktop-layout-fix
