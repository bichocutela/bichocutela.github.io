name: Patch layout desktop

on:
  push:
    branches: [desktop-layout-fix]
    paths:
      - ".github/workflows/desktop-layout-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: desktop-layout-fix
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Aplicar ajustes desktop
        run: |
          if ! grep -q "Desktop drawer: rolagem independente" source/client/src/desktop.css; then
            echo "" | base64 -d >> source/client/src/desktop.css
          fi
          if ! grep -q "Desktop: consulta ampla, banner compacto" source/client/src/pages/ProductConsultation.css; then
            echo "" | base64 -d >> source/client/src/pages/ProductConsultation.css
          fi

      - name: Validar diff
        run: git diff --check

      - name: Instalar dependências
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Verificar TypeScript
        working-directory: source
        run: pnpm check

      - name: Gerar build
        working-directory: source
        run: pnpm exec vite build

      - name: Remover workflow temporário e commitar
        run: |
          rm -f .github/workflows/desktop-layout-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/client/src/desktop.css source/client/src/pages/ProductConsultation.css .github/workflows/desktop-layout-fix.yml
          git commit -m 'Organiza PWA para uso no desktop'
          git push origin HEAD:desktop-layout-fix
