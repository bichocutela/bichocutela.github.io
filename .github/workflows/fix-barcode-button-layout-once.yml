name: Fix barcode button PWA

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-barcode-button-layout-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - name: Install
        working-directory: source
        run: pnpm install --frozen-lockfile
      - name: Patch
        run: python3 .github/scripts/fix_barcode_button_css.py
      - name: Check
        working-directory: source
        run: pnpm check
      - name: Build
        working-directory: source
        run: pnpm exec vite build
      - name: Cleanup
        run: rm .github/workflows/fix-barcode-button-layout-once.yml .github/scripts/fix_barcode_button_css.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/client/src/pages/ProductConsultation.css .github/workflows/fix-barcode-button-layout-once.yml .github/scripts/fix_barcode_button_css.py
          git commit -m "Fix barcode action visibility on PWA"
          git push
