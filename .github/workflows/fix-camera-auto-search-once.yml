name: Corrigir busca automática pela câmera no PWA

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-camera-auto-search-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar correção
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('source/client/src/pages/ProductConsultation.tsx')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '  const requestSequence = useRef(0);\n',
                  '  const requestSequence = useRef(0);\n  const skipNextDebouncedSearch = useRef<string | null>(null);\n'
              ),
              (
                  '  async function runSearch(targetPage = 0, fresh = false) {\n    const clean = query.trim();\n',
                  '  async function runSearch(targetPage = 0, fresh = false, searchOverride?: string, categoryOverride?: string) {\n    const clean = (searchOverride ?? query).trim();\n    const activeCategoryId = categoryOverride ?? categoryId;\n'
              ),
              (
                  '      const result = await searchConsultationProducts(clean, targetPage, categoryId, fresh);\n',
                  '      const result = await searchConsultationProducts(clean, targetPage, activeCategoryId, fresh);\n'
              ),
              (
                  '    const timer = window.setTimeout(() => { void runSearch(0, false); }, 180);\n',
                  '    const searchKey = `${query.trim()}|${categoryId}`;\n    if (skipNextDebouncedSearch.current === searchKey) {\n      skipNextDebouncedSearch.current = null;\n      return;\n    }\n    const timer = window.setTimeout(() => { void runSearch(0, false); }, 180);\n'
              ),
              (
                  '  function onScanned(code: string) {\n    setCameraOpen(false);\n    setQuery(code.trim());\n    toast.success("Código identificado. Consultando produto...");\n  }\n',
                  '  function onScanned(code: string) {\n    const clean = code.trim();\n    if (!clean) return;\n\n    // Igual ao Android: a leitura da câmera ignora filtros antigos e dispara a busca\n    // imediatamente. Não depende do debounce nem de uma segunda interação do usuário.\n    skipNextDebouncedSearch.current = `${clean}|`;\n    setCameraOpen(false);\n    setCategoryId("");\n    setQuery(clean);\n    toast.success("Código identificado. Consultando produto...");\n    void runSearch(0, true, clean, "");\n  }\n'
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Patch inseguro: esperado 1 trecho, encontrado {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/fix-camera-auto-search-once.yml').unlink()
          PY

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Instalar dependências
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Verificar TypeScript
        working-directory: source
        run: pnpm check

      - name: Gerar PWA
        working-directory: source
        run: pnpm exec vite build

      - name: Commit e push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/client/src/pages/ProductConsultation.tsx .github/workflows/fix-camera-auto-search-once.yml
          git commit -m "Corrige busca automática pela câmera no PWA"
          git push
