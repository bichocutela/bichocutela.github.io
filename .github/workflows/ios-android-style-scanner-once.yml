name: Scanner PWA no fluxo do Android uma vez

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ios-android-style-scanner-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Instalar dependências
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Aplicar scanner
        run: |
          python3 .github/scripts/patch_ios_android_scanner.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('source/client/src/pages/ProductConsultation.tsx')
          s=p.read_text(encoding='utf-8').replace('[...value].some((char) => {', 'value.split("").some((char) => {')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Remover arquivos temporários
        run: rm .github/workflows/ios-android-style-scanner-once.yml .github/scripts/patch_ios_android_scanner.py

      - name: Validar TypeScript e build
        working-directory: source
        run: |
          pnpm check
          pnpm exec vite build

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Alinha scanner PWA ao fluxo do Android"
          git push
