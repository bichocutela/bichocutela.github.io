name: Scanner contínuo no iPhone uma vez

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ios-live-barcode-scanner-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Instalar scanner ZXing
        working-directory: source
        run: pnpm add @zxing/browser@0.1.5 @zxing/library@0.21.3

      - name: Aplicar scanner contínuo
        run: python3 .github/scripts/patch_ios_live_scanner.py

      - name: Remover workflow temporário
        run: rm .github/workflows/ios-live-barcode-scanner-once.yml

      - name: Validar TypeScript e build
        working-directory: source
        run: |
          pnpm check
          pnpm exec vite build

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/package.json source/pnpm-lock.yaml source/client/src/pages/ProductConsultation.tsx source/client/src/pages/ProductConsultation.css .github/scripts/patch_ios_live_scanner.py .github/workflows/ios-live-barcode-scanner-once.yml
          git commit -m "Torna leitura de código contínua no iPhone"
          git push
