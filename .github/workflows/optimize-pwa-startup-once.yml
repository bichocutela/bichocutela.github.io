name: Otimizar inicializacao PWA uma vez

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/optimize-pwa-startup-once.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - name: Instalar dependencias
        working-directory: source
        run: pnpm install --frozen-lockfile
      - name: Aplicar code splitting conservador
        run: python3 .github/scripts/optimize_pwa_startup.py
      - name: Verificar TypeScript
        working-directory: source
        run: pnpm check
      - name: Gerar build e validar producao
        working-directory: source
        run: |
          pnpm exec vite build
          echo "Arquivos principais:"
          find dist/public/assets -maxdepth 1 -type f -printf '%f %s bytes\n' | sort -k2 -nr | head -20
          if grep -q 'manus-runtime' dist/public/index.html; then
            echo 'ERRO: manus-runtime ainda presente no HTML de produção'
            exit 1
          fi
      - name: Remover temporarios
        run: rm .github/workflows/optimize-pwa-startup-once.yml .github/scripts/optimize_pwa_startup.py
      - name: Commit e push somente apos validacao
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Otimiza carregamento inicial do PWA sem alterar funcionalidades"
          git push
