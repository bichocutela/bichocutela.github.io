name: Aplicar sincronização do banner de Consultar Preços

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-consultation-banner-sync-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Aplicar alteração pontual
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          target = Path("source/client/src/pages/ProductConsultation.tsx")
          text = target.read_text(encoding="utf-8")

          import_anchor = 'import { nrdAuth } from "@/lib/firebase";\n'
          import_replacement = import_anchor + 'import SyncedConsultationBanner from "@/components/SyncedConsultationBanner";\n'
          if import_replacement not in text:
              if text.count(import_anchor) != 1:
                  raise SystemExit("Import do Firebase não encontrado de forma única")
              text = text.replace(import_anchor, import_replacement, 1)

          old_const = 'const bannerUrl = "/manus-storage/nrd-banner-multicolor-original_62abf744.jpg";\n\n'
          if old_const in text:
              text = text.replace(old_const, "", 1)

          old_banner = '      <div className="pc-banner"><img src={bannerUrl} alt="Consultar Preços" /><div><strong>Consultar Preços</strong><span>Preço, condições e ofertas em um só lugar</span></div></div>\n'
          new_banner = '      <SyncedConsultationBanner />\n'
          if new_banner not in text:
              if text.count(old_banner) != 1:
                  raise SystemExit("Banner antigo não encontrado de forma única")
              text = text.replace(old_banner, new_banner, 1)

          target.write_text(text, encoding="utf-8")
          Path(".github/workflows/patch-consultation-banner-sync-once.yml").unlink()
          PY

      - name: Instalar dependências
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Verificar TypeScript
        working-directory: source
        run: pnpm check

      - name: Commit e push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/client/src/pages/ProductConsultation.tsx source/client/src/components/SyncedConsultationBanner.tsx .github/workflows/patch-consultation-banner-sync-once.yml
          git commit -m "Sincroniza banner de Consultar Preços com Android"
          git push
