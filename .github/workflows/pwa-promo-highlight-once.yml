name: Destaque promocional PWA uma vez
on:
  push:
    branches: [main]
    paths: [".github/workflows/pwa-promo-highlight-once.yml"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 10.4.1 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: source
      - name: Aplicar destaque de oferta e retirar categorias
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('source/client/src/pages/ProductConsultation.tsx')
          s=p.read_text()
          old='''      <div className="pc-search-actions">\n        <select value={categoryId} onChange={(event) => setCategoryId(event.target.value)} aria-label="Filtrar categoria">\n          <option value="">Todas as categorias</option>\n          {categories.map((category) => <option key={category.id} value={category.id}>{category.description}</option>)}\n        </select>\n        <button onClick={() => void runSearch(0, true)} disabled={query.trim().length < 2 || loading}><Search size={18} /> Pesquisar produto</button>\n      </div>'''
          new='''      <div className="pc-search-actions pc-search-actions--single">\n        <button onClick={() => void runSearch(0, true)} disabled={query.trim().length < 2 || loading}><Search size={18} /> Pesquisar produto</button>\n      </div>'''
          if old not in s: raise SystemExit('bloco categorias não encontrado')
          s=s.replace(old,new)
          old2='''      {page.items.map((product) => <button className="pc-product-card" key={product.id} onClick={() => void openProduct(product)}>\n        <div className="pc-product-copy">\n          <strong>{product.description}</strong>\n          <span>Código: {product.code || "não informado"}{product.barcode ? ` · EAN: ${product.barcode}` : ""}</span>\n          <small>{product.categories.length ? product.categories.join(" · ") : "Varejo"}</small>\n        </div>\n        <div className="pc-product-price"><span>Preço principal</span><strong>{formatMoney(product.value)}</strong></div>\n        <ChevronRight size={20} />\n      </button>)}'''
          new2='''      {page.items.map((product) => <ProductResultCard key={product.id} product={product} onOpen={() => void openProduct(product)} />)}'''
          if old2 not in s: raise SystemExit('card de resultado não encontrado')
          s=s.replace(old2,new2)
          marker='''function ProductDetail({ product, offers, queriedAt, busy, canAdd, onRefresh, onAdd, onClose }: {'''
          component='''function ProductResultCard({ product, onOpen }: { product: ConsultationProduct; onOpen: () => void }) {\n  const [offers, setOffers] = useState<CommercialOffer[]>([]);\n  useEffect(() => {\n    let alive = true;\n    void offersForProduct(product).then((items) => { if (alive) setOffers(items.filter((offer) => offer.family !== "PRICE")); }).catch(() => undefined);\n    return () => { alive = false; };\n  }, [product]);\n\n  const featured = offers.find((offer) => offer.price != null) || offers[0] || null;\n  return <button className={`pc-product-card${featured ? " pc-product-card--promo" : ""}`} onClick={onOpen}>\n    <div className="pc-product-copy">\n      <strong>{product.description}</strong>\n      <span>Código: {product.code || "não informado"}{product.barcode ? ` · EAN: ${product.barcode}` : ""}</span>\n      <small>{product.categories.length ? product.categories.join(" · ") : "Varejo"}</small>\n      {featured && <div className="pc-promo-badge">OFERTA</div>}\n    </div>\n    <div className="pc-product-price">\n      {featured ? <>\n        <span className="pc-promo-title">{featured.title}</span>\n        {featured.referencePrice != null && featured.price != null && featured.referencePrice > featured.price && <small className="pc-result-old-price">De {formatMoney(featured.referencePrice)}</small>}\n        <strong className="pc-result-promo-price">{featured.price != null ? formatMoney(featured.price) : (featured.headline || "Condição especial")}</strong>\n        {featured.headline && featured.price != null && <small className="pc-result-headline">{featured.headline}</small>}\n      </> : <>\n        <span>Preço principal</span><strong>{formatMoney(product.value)}</strong>\n      </>}\n    </div>\n    <ChevronRight size={20} />\n  </button>;\n}\n\n'''
          if marker not in s: raise SystemExit('marcador ProductDetail não encontrado')
          s=s.replace(marker,component+marker)
          p.write_text(s)

          c=Path('source/client/src/pages/ProductConsultation.css')
          css=c.read_text()
          css += '''\n.pc-search-actions--single{grid-template-columns:1fr}.pc-search-actions--single button{justify-content:center}.pc-product-card--promo{border:2px solid #d71920;background:linear-gradient(135deg,#fff 0%,#fff8f3 100%);box-shadow:0 5px 18px rgba(199,0,24,.12)}.pc-promo-badge{align-self:flex-start;margin-top:4px;padding:3px 8px;border-radius:999px;background:#c80018;color:#fff;font-size:.68rem;font-weight:950;letter-spacing:.08em}.pc-promo-title{color:#c80018!important;font-weight:900;text-transform:uppercase}.pc-result-old-price{text-decoration:line-through;color:#777;font-size:.72rem}.pc-product-price .pc-result-promo-price{font-size:1.35rem;color:#c80018;font-weight:950}.pc-result-headline{max-width:180px;text-align:right;color:#8b1b1b;font-size:.7rem;font-weight:800;white-space:normal}.pc-product-card--promo .pc-product-copy>strong{font-weight:900}@media(max-width:680px){.pc-product-price .pc-result-promo-price{font-size:1.55rem}.pc-result-headline{text-align:left;max-width:none}}\n'''
          c.write_text(css)
          PY
      - name: Remover workflow temporário
        run: rm .github/workflows/pwa-promo-highlight-once.yml
      - name: Validar TypeScript e build
        working-directory: source
        run: |
          pnpm check
          pnpm exec vite build
      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/client/src/pages/ProductConsultation.tsx source/client/src/pages/ProductConsultation.css .github/workflows/pwa-promo-highlight-once.yml
          git commit -m "Destaca ofertas e remove filtro de categorias no PWA"
          git push origin main
