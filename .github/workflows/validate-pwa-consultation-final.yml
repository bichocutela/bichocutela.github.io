name: Validar Consulta PWA Final

on:
  push:
    branches: [feat/pwa-consultar-produtos]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Build PWA
        env:
          VITE_SUPABASE_URL: https://kkayksyzksexoarpfxyj.supabase.co
          VITE_SUPABASE_ANON_KEY: build-validation-placeholder
        run: pnpm exec vite build
