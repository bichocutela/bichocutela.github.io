name: Validar Consultar Produtos PWA

on:
  push:
    branches:
      - feat/pwa-consultar-produtos
    paths:
      - "source/**"
      - "404.html"
      - "supabase/**"
      - ".github/workflows/validate-pwa-consultation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Build PWA
        env:
          VITE_SUPABASE_URL: https://kkayksyzksexoarpfxyj.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-public-key-for-build
        run: pnpm exec vite build
